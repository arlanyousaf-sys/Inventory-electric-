    <title>Inventory Search System</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f1f5f9; margin: 0; padding: 12px; color: #1e293b; }
        .container { max-width: 100%; background: #ffffff; padding: 16px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        h2 { color: #1e3a8a; text-align: center; margin-top: 5px; margin-bottom: 16px; font-size: 20px; font-weight: 700; }
        .search-box { position: sticky; top: 0; background: #ffffff; padding-bottom: 10px; z-index: 10; }
        input[type="text"] { width: 100%; padding: 14px 16px; border: 2px solid #cbd5e1; border-radius: 12px; font-size: 16px; outline: none; -webkit-appearance: none; }
        input[type="text"]:focus { border-color: #3b82f6; }
        .stats-summary { background-color: #eff6ff; border-left: 4px solid #3b82f6; padding: 12px; margin-bottom: 16px; border-radius: 4px 12px 12px 4px; font-size: 14px; color: #1e40af; font-weight: 600; }
        .table-container { overflow-x: auto; border-radius: 12px; border: 1px solid #e2e8f0; }
        table { width: 100%; border-collapse: collapse; background: white; font-size: 15px; }
        th, td { padding: 12px 10px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        th { background-color: #1e3a8a; color: white; font-weight: 600; font-size: 14px; }
        .item-name { font-weight: 600; color: #0f172a; }
        .badge { background-color: #f1f5f9; color: #475569; padding: 4px 8px; border-radius: 6px; font-size: 12px; }
    </style>
</head>

function loadTable(data) {
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';
    if(data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="3" class="no-results">Koi item nahi mila.</td></tr>';
        return;
    }
    data.forEach(item => {
        tbody.innerHTML += `<tr>
            <td><span class="item-name">${item.name}</span></td>
            <td><span class="badge">${item.dept}</span></td>
            <td><span class="qty-val">${item.qty}</span></td>
        </tr>`;
    });
}

function searchInventory() {
    const query = document.getElementById('searchInput').value.toLowerCase().trim();
    const statsDiv = document.getElementById('statsSummary');
    if (query === '') {
        loadTable(inventoryData);
        statsDiv.innerHTML = "Total Sheet Items: 199";
        return;
    }
    const filtered = inventoryData.filter(item => item.name.toLowerCase().includes(query) || item.dept.toLowerCase().includes(query));
    const totalQty = filtered.reduce((sum, item) => sum + item.qty, 0);
    loadTable(filtered);
    statsDiv.innerHTML = `Milaay: ${filtered.length} | Kul Tadad: ${totalQty}`;
}
